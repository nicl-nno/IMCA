name: artifact-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run --frozen python -m pytest -q
      - run: uv run --frozen python experiments/reproduce_code.py
      - run: uv run --frozen python experiments/evaluate_inspectable_memory.py --output outputs/temporal.json
