[project]
name = "inspectable-agent-memory"
version = "0.1.0"
description = "Standalone research artifact for Inspectable Memory"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15,<0.16"]
benchmark = ["pyarrow>=21,<22"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["python"]
pythonpath = ["python", "experiments"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"data/code/source/**" = ["ALL"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
